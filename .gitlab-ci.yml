default:
  image: "gitlab.futo.org:5050/keyboard/latinime/gradle:latest"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

stages:          # List of stages for jobs, and their order of execution
  - test
  - buildDev
  - buildRelease

unit-test-job:
  stage: test
  tags:
    - docker
  before_script:
    - git fetch origin $CI_COMMIT_BRANCH:$CI_COMMIT_BRANCH
    - export VERSION_NAME=`git describe --tags --dirty`
    - export VERSION_CODE=`git rev-list --first-parent --count $GIT_BRANCH`
    - echo $VERSION_CODE $VERSION_NAME
    - ./setUpPropertiesCI.sh
  script:
    - ./gradlew testDevDebugUnitTest -s
  artifacts:
    reports:
      junit:
        - ./app/build/test-results/testDevDebugUnitTest/*.xml 

buildDev:
  stage: buildDev
  tags:
    - docker
  before_script:
    - git fetch origin $CI_COMMIT_BRANCH:$CI_COMMIT_BRANCH
    - export VERSION_NAME=`git describe --tags --dirty`
    - export VERSION_CODE=`git rev-list --first-parent --count $GIT_BRANCH`
    - echo $VERSION_CODE $VERSION_NAME
    - ./setUpPropertiesCI.sh
  script:
    - gradle signingReport
    - gradle assembleDevRelease -s
    - mv app/build/outputs/apk/dev/release/app-dev-release.apk ./voice-input-nightly-$VERSION_NAME.apk
    - touch VERSION_CODE_$VERSION_CODE.txt
    - touch VERSION_NAME_$VERSION_NAME.txt
    - echo "Keyboard (Unstable) $VERSION_NAME - https://gitlab.futo.org/keyboard/voiceinput/-/jobs/$CI_JOB_ID/artifacts/raw/voice-input-nightly-$VERSION_NAME.apk"
    - echo $VERSION_CODE $VERSION_NAME
    - ./uploadNightly.sh ./voice-input-nightly-$VERSION_NAME.apk $VERSION_CODE $VERSION_NAME-unstable
  artifacts:
    name: "voice-input-nightly-$VERSION_NAME"
    paths: 
      - ./*.apk
  when: manual

buildRelease:
  stage: buildRelease
  tags:
    - docker
  before_script:
    - git fetch origin master:master
    - export VERSION_NAME=`git describe --tags --dirty`
    - export VERSION_CODE=`git rev-list --first-parent --count master`
    - echo $VERSION_CODE $VERSION_NAME
    - ./setUpPropertiesCI.sh
  script:
    - ./gradlew bundlePlayStoreRelease -s
    - ./gradlew assembleStandaloneRelease -s
    - ./gradlew assembleFDroidRelease -s
    - mv app/build/outputs/bundle/playStoreRelease/app-playStore-release.aab ./playStore.aab
    - mv app/build/outputs/apk/standalone/release/app-standalone-release.apk ./standalone.apk
    - mv app/build/outputs/apk/fDroid/release/app-fDroid-release.apk ./fdroid.apk
  artifacts:
    name: "release-$CI_COMMIT_SHORT_SHA"
    paths: 
      - ./*.aab
      - ./*.apk
  only:
    - tags
  except:
    - branches
  when: manual